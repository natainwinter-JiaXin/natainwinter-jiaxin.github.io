<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio</title>
    <link rel="stylesheet" href="assets/styles.css?v=9" />
  </head>
  <body class="viewer-page reader-has-art">
    <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>
    <div class="scrollbar-track" id="verticalScrollBar" aria-hidden="true">
      <div class="scrollbar-thumb" id="verticalScrollThumb"></div>
    </div>
    <main class="reader">
      <canvas class="reader-octopus" id="readerOctopus" aria-hidden="true"></canvas>
      <header class="reader-header">
        <h1 class="reader-title" id="readerTitle">作品</h1>
        <button class="reader-back" id="readerBackBtn" type="button">返回</button>
      </header>
      <div class="reader-layout">
        <section class="reader-body" id="readerBody"></section>
        <figure class="reader-art" aria-label="Machine illustration">
          <img src="assets/machine.png?v=3" alt="Machine" />
        </figure>
      </div>
    </main>

    <script src="assets/app.js?v=3"></script>
    <script src="assets/portfolio-viewer.js?v=3"></script>
    <script src="assets/octopus.js?v=16"></script>
  </body>
</html>
